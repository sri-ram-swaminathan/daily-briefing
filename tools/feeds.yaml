  - name: npr_elections
    topic: midterms
    section: Elections
    url: https://feeds.npr.org/1001/rss.xml
    must_match: "midterm|election|ballot|voter|recount|house seat|senate race|governor|redistrict|runoff"
    region: US
    publication: {name: NPR, publisher: National Public Radio, newstex_id: X0401, code: NPRN-X0401, url: https://www.npr.org, country: USA}

