# Extra topic feeds for tools/fetch_feeds.py, written to news-data/<name>.jsonl.
# newstex_id values starting with X are ours (these outlets are not part of the Newstex delivery).
feeds:
  # ---------------- Weather ----------------
  - name: guardian_weather
    topic: weather
    section: Weather
    url: https://www.theguardian.com/uk/weather/rss
    skip: "/live/|crossword"
    publication: {name: The Guardian, publisher: Guardian News & Media, newstex_id: X0101, code: GUAR-X0101, url: https://www.theguardian.com, country: UK}
  - name: guardian_extreme_weather
    topic: weather
    section: Extreme weather
    url: https://www.theguardian.com/world/extreme-weather/rss
    skip: "/live/"
    publication: {name: The Guardian, publisher: Guardian News & Media, newstex_id: X0101, code: GUAR-X0101, url: https://www.theguardian.com, country: UK}
  - name: severe_weather_europe
    topic: weather
    section: Forecasts
    url: https://severe-weather.eu/feed/
    pub_type: Weblog
    publication: {name: Severe Weather Europe, publisher: Severe Weather Europe, newstex_id: X0102, code: SWEU-X0102, url: https://severe-weather.eu, country: EU}

  # ---------------- Climate change ----------------
  - name: guardian_climate
    topic: climate
    section: Climate crisis
    url: https://www.theguardian.com/environment/climate-crisis/rss
    skip: "/live/"
    publication: {name: The Guardian, publisher: Guardian News & Media, newstex_id: X0101, code: GUAR-X0101, url: https://www.theguardian.com, country: UK}
  - name: inside_climate_news
    topic: climate
    section: Climate
    url: https://insideclimatenews.org/feed/
    region: US
    publication: {name: Inside Climate News, publisher: Inside Climate News, newstex_id: X0201, code: ICNW-X0201, url: https://insideclimatenews.org, country: USA}
  - name: yale_climate_connections
    topic: climate
    section: Climate
    url: https://yaleclimateconnections.org/feed/
    region: US
    publication: {name: Yale Climate Connections, publisher: Yale Center for Environmental Communication, newstex_id: X0202, code: YCCN-X0202, url: https://yaleclimateconnections.org, country: USA}
  - name: bbc_science_environment
    topic: climate
    section: Science & Environment
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    skip: "/videos?/|/av/|/sounds/"
    publication: {name: BBC News, publisher: BBC, newstex_id: X0001, code: BBCN-X0001, url: https://www.bbc.co.uk/news, country: UK}

  # ---------------- Sports ----------------
  - name: bbc_sport
    topic: sports
    section: Sport
    url: https://feeds.bbci.co.uk/sport/rss.xml
    skip: "/live/|/videos?/|/av/|/sounds/"
    publication: {name: BBC Sport, publisher: BBC, newstex_id: X0002, code: BBCS-X0002, url: https://www.bbc.co.uk/sport, country: UK}
  - name: espn
    topic: sports
    section: Top Headlines
    url: https://www.espn.com/espn/rss/news
    user_agent: Mozilla/5.0  # ESPN's CDN answers 202/empty to full browser strings
    skip: "/video/"
    region: US
    publication: {name: ESPN, publisher: ESPN, newstex_id: X0301, code: ESPN-X0301, url: https://www.espn.com, country: USA}
  - name: guardian_sport
    topic: sports
    section: Sport
    url: https://www.theguardian.com/sport/rss
    skip: "/live/"
    publication: {name: The Guardian, publisher: Guardian News & Media, newstex_id: X0101, code: GUAR-X0101, url: https://www.theguardian.com, country: UK}

  # ---------------- Politics ----------------
  - name: bbc_politics
    topic: politics
    section: UK Politics
    url: https://feeds.bbci.co.uk/news/politics/rss.xml
    skip: "/live/|/videos?/|/av/|/sounds/"
    publication: {name: BBC News, publisher: BBC, newstex_id: X0001, code: BBCN-X0001, url: https://www.bbc.co.uk/news, country: UK}
