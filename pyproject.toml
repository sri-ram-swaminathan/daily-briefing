[project]
name = "dass-news"
version = "0.1.0"
description = "Review news articles with a council of OpenAI personas and listen to an interruptible voice briefing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "huggingface-hub>=2.4",
    "imageio-ffmpeg>=0.8.1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1",
    "pyyaml>=6,<7",
    "uvicorn>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
